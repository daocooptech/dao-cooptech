<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — cooptech</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="public-header">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="topbar-left">
    <a class="logo" href="index.html" aria-label="ДАО КООПТЕХ — на главную"><img class="logo-img" src="assets/cooptech-logo.png" alt="cooptech"></a>
    <span class="platform-name">Открытая социально-экономическая платформа</span>
  </div>
  <div class="auth-actions">
    <a class="button ghost" href="login.html">Войти</a>
    <a class="button" href="registration.html">Регистрация</a>
  </div>
</header>
<main class="main" id="main">

    <div class="card form-card">
      <h1>Создать аккаунт</h1>
      <div class="hint">Присоединяйтесь к сети ДАО КООПТЕХ</div>
      <form data-demo-form="my-page.html">
        <div class="field">
          <label for="reg-name">Имя и фамилия</label>
          <input class="input" id="reg-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input class="input" id="reg-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="reg-phone">Телефон</label>
          <input class="input" id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00">
        </div>
        <div class="field">
          <label for="reg-city">Город</label>
          <input class="input" id="reg-city" name="city" type="text" autocomplete="address-level2">
        </div>
        <div class="field">
          <label for="reg-password">Пароль</label>
          <input class="input" id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="reg-password2">Подтверждение пароля</label>
          <input class="input" id="reg-password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field" style="color:var(--slate)"><label><input type="checkbox" name="terms" required> Согласен с условиями использования</label></div>
        <button class="button" type="submit" style="width:100%">Зарегистрироваться</button>
      </form>
      <div class="form-links"><a href="login.html">Уже есть аккаунт? Войти</a></div>
    </div>

  </main>

<script src="app.js"></script>
</body>
</html>
