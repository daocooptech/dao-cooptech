<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — cooptech</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="public-header">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="topbar-left">
    <a class="logo" href="index.html" aria-label="ДАО КООПТЕХ — на главную"><img class="logo-img" src="assets/cooptech-logo.png" alt="cooptech"></a>
    <span class="platform-name">Открытая социально-экономическая платформа</span>
  </div>
  <div class="auth-actions">
    <a class="button ghost" href="login.html">Войти</a>
    <a class="button" href="registration.html">Регистрация</a>
  </div>
</header>
<main class="main" id="main">

    <div class="card form-card">
      <h1>С возвращением</h1>
      <div class="hint">Войдите в свой аккаунт cooptech</div>
      <form data-demo-form="my-page.html">
        <div class="field">
          <label for="login-id">Email или телефон</label>
          <input class="input" id="login-id" name="login" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field" style="color:var(--slate)"><label><input type="checkbox" name="remember"> Запомнить меня</label></div>
        <button class="button" type="submit" style="width:100%">Войти</button>
      </form>
      <div class="form-links">
        <a href="password-recovery.html">Забыли пароль?</a>
        <a href="registration.html">Нет аккаунта? Зарегистрироваться</a>
      </div>
    </div>

  </main>

<script src="app.js"></script>
</body>
</html>
