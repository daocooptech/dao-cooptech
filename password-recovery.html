<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Восстановление пароля — cooptech</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="public-header">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="topbar-left">
    <a class="logo" href="index.html" aria-label="ДАО КООПЕХ — на главную"><img class="logo-img" src="assets/cooptech-logo.png" alt="cooptech"></a>
    <span class="platform-name">Открытая социально-экономическая платформа</span>
  </div>
  <div class="auth-actions">
    <a class="button ghost" href="login.html">Войти</a>
    <a class="button" href="registration.html">Регистрация</a>
  </div>
</header>
<main class="main" id="main">

    <div class="card form-card">
      <h1>Восстановление пароля</h1>
      <div class="hint">Укажите email или телефон — пришлём ссылку для сброса пароля.</div>
      <form data-demo-form="login.html">
        <div class="field">
          <label for="recovery-id">Email или телефон</label>
          <input class="input" id="recovery-id" name="login" type="text" autocomplete="username" required>
        </div>
        <button class="button" type="submit" style="width:100%">Отправить ссылку</button>
      </form>
      <div class="form-links"><a href="login.html">Вернуться ко входу</a></div>
    </div>

  </main>

<script src="app.js"></script>
</body>
</html>
